<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyMate</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172a43;font:16px Arial,sans-serif}header,main{max-width:650px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}small,p{color:#65758a;line-height:1.7}h1{font-size:28px;margin:8px 0}h2{font-size:19px}.hero{background:linear-gradient(125deg,#122e52,#146b79);color:white;padding:28px;border-radius:24px;margin-bottom:18px}.hero p{color:#c6e4e8}.value{font-size:38px;font-weight:bold;direction:ltr;text-align:right}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:20px;background:white;border:1px solid #e4eaf1;border-radius:20px;margin-bottom:16px;box-shadow:0 6px 24px #12345606}button{border:0;border-radius:12px;padding:13px;background:#126c79;color:white;font:inherit;cursor:pointer}button.secondary{background:#e8f2f4;color:#126c79}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e4eaf1;display:flex;justify-content:center;padding:12px;gap:8px}nav button{background:white;color:#65758a;font-size:14px}nav button.active{background:#e8f2f4;color:#126c79}main{padding-top:0;padding-bottom:110px}input,select{width:100%;padding:13px;border:1px solid #dce4ee;border-radius:10px;background:white;font:inherit;margin:7px 0 14px}label{font-size:14px}form button{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #eef2f6;padding:14px 0}.row button{background:#fff0ef;color:#a43a37;padding:8px}.empty{text-align:center;padding:25px 10px}.positive{color:#087d66}.negative{color:#b44141}strong{display:block;margin-top:8px;font-size:23px}.badge{font-size:12px;color:#126c79;background:#e8f2f4;padding:8px;border-radius:20px}</style><header><div><small>הכסף שלך, בצורה ברורה</small><h1>MoneyMate</h1></div><span class="badge">גרסת תיקון 0.2</span></header><main id="app"></main><nav id="nav"></nav><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;try{state=JSON.parse(localStorage.getItem('mm'))}catch(e){}state=state||{};state.tx=state.tx||[];state.invest=state.invest||[];state.cats=state.cats||['אוכל','תחבורה','דיור','בילויים','בריאות','קניות','אחר'];state.rates=state.rates||{USD:3.7,GBP:4.6};let tab='home';const money=n=>new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS'}).format(n),ils=t=>Number(t.amount??t.value)*(t.currency==='ILS'?1:Number(state.rates[t.currency]||1)),save=()=>{try{localStorage.setItem('mm',JSON.stringify(state))}catch(e){alert('לא ניתן לשמור בדפדפן. הנתונים לא גובו.')}};function go(t){tab=t;render()}function render(){const names={home:'סקירה',tx:'פעולות',invest:'השקעות',settings:'הגדרות'};$('#nav').innerHTML=Object.entries(names).map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');let h='';if(tab==='home'){const month=new Date().toISOString().slice(0,7),ts=state.tx.filter(t=>t.date.startsWith(month)),exp=ts.filter(t=>t.type==='expense').reduce((s,t)=>s+ils(t),0),inc=ts.filter(t=>t.type==='income').reduce((s,t)=>s+ils(t),0);h=`<section class="hero"><p>היתרה החודשית שלך</p><div class="value">${money(inc-exp)}</div><p>לפי הפעולות שהזנת · ${month}</p></section><div class="grid"><div class="card">הכנסות<strong class="positive">${money(inc)}</strong></div><div class="card">הוצאות<strong class="negative">${money(exp)}</strong></div></div><section class="card"><h2>מתחילים לעשות סדר</h2><p>מוסיפים פעולות ומרכזים את הקרנות וההשקעות במקום אחד.</p><div class="grid"><button onclick="go('tx')">הוסף פעולה</button><button class="secondary" onclick="go('invest')">התיק שלי</button></div></section><section class="card"><h2>תמונת השקעות</h2><strong>${money(state.invest.reduce((s,i)=>s+ils(i),0))}</strong><p>שווי ידני · אין מחירי שוק בזמן אמת</p></section><section class="card"><h2>ייבוא דפי אשראי</h2><p>הייבוא בבנייה ואינו זמין בגרסת התיקון. אין להעלות מסמכים פיננסיים לריפו הציבורי.</p></section>`}if(tab==='tx'||tab==='invest'){const inv=tab==='invest';h=`<h2>${inv?'הקרנות וההשקעות שלי':'הפעולות שלי'}</h2><form class="card" id="entry"><label>${inv?'שם הקרן או ההשקעה':'תיאור הפעולה'}<input name="name" required maxlength="160"></label>${inv?'<label>עלות הרכישה<input name="cost" type="number" min="0" step="0.01" required></label>':'<label>סוג פעולה<select name="type"><option value="expense">הוצאה</option><option value="income">הכנסה</option></select></label><label>קטגוריה<select name="category">'+state.cats.map(c=>'<option>'+esc(c)+'</option>').join('')+'</select></label><label>תאריך<input name="date" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></label>'}<div class="grid"><label>${inv?'שווי נוכחי':'סכום'}<input name="amount" type="number" min="0.01" step="0.01" required></label><label>מטבע<select name="currency"><option value="ILS">שקל</option><option value="USD">דולר</option><option value="GBP">לירה שטרלינג</option></select></label></div><button>שמור ${inv?'השקעה':'פעולה'}</button></form><section class="card">`;const items=inv?state.invest:state.tx;h+=items.length?items.map((t,i)=>`<div class="row"><div>${esc(t.name||t.note||t.category)}<p>${inv?'שווי נוכחי':esc(t.date)} · ${esc(t.currency)}</p>${inv?'<small>רווח/הפסד פשוט: '+money(ils(t)-Number(t.invested)*(t.currency==='ILS'?1:state.rates[t.currency]))+' · ללא מס ודיבידנדים</small>':''}</div><div>${money(ils(t))}<button aria-label="מחק" onclick="remove(${i},${inv})">מחק</button></div></div>`).join(''):'<div class="empty"><h2>מקום להתחלה חדשה</h2><p>עדיין אין נתונים. הוסף את הפריט הראשון בטופס שמעל.</p></div>';h+='</section>'}if(tab==='settings')h=`<h2>הגדרות</h2><section class="card"><h2>קטגוריות</h2><p>${state.cats.map(esc).join(' · ')}</p><form id="cat"><label>קטגוריה חדשה<input name="category" required maxlength="50"></label><button>הוסף קטגוריה</button></form></section><section class="card"><h2>שערי מטבע ידניים</h2><p>הערכים הם ערכי דוגמה ולא שערים עדכניים. עדכן לפני הסתמכות על סיכומים.</p><form id="rates"><label>שקלים לדולר<input name="USD" type="number" min="0.01" step="0.0001" required value="${Number(state.rates.USD)}"></label><label>שקלים ללירה שטרלינג<input name="GBP" type="number" min="0.01" step="0.0001" required value="${Number(state.rates.GBP)}"></label><button>שמור שערים</button></form></section><section class="card"><h2>שמירה ופרטיות</h2><p>הנתונים נשמרים בדפדפן הזה בלבד, ללא סנכרון וללא הצפנה ייעודית. מחיקת נתוני הדפדפן עלולה למחוק אותם.</p><button onclick="backup()">הורד גיבוי JSON</button></section>`;$('#app').innerHTML=h;if($('#entry'))$('#entry').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),amount=Number(d.amount);if(!Number.isFinite(amount)||amount<=0)return;if(tab==='invest')state.invest.push({id:Date.now(),name:d.name,type:'קרן',invested:Number(d.cost),value:amount,currency:d.currency});else state.tx.unshift({id:Date.now(),note:d.name,amount,currency:d.currency,type:d.type,date:d.date,category:d.category});save();render()};if($('#cat'))$('#cat').onsubmit=e=>{e.preventDefault();const c=new FormData(e.target).get('category').trim();if(c&&!state.cats.includes(c))state.cats.push(c);save();render()};if($('#rates'))$('#rates').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);state.rates={USD:Number(d.get('USD')),GBP:Number(d.get('GBP'))};save();render()}}function remove(i,inv){if(confirm('למחוק את הפריט?')){(inv?state.invest:state.tx).splice(i,1);save();render()}}function backup(){const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='moneymate-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();</script></html>
